<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <!-- Background Gradient (Sleek Indigo-Navy) -->
    <linearGradient id="maleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <!-- Skin Tone -->
    <linearGradient id="maleSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba471" />
    </linearGradient>
    <!-- Shirt -->
    <linearGradient id="maleShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <!-- Peci / Kopiah -->
    <linearGradient id="peciGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Full Background (Seamless in rectangle photo boxes and auto-rounded in circle frames) -->
  <rect width="100%" height="100%" fill="url(#maleBg)" />

  <g transform="translate(0, 10)">
    <!-- Shoulders / Clothes (Baju Koko / Kemeja) -->
    <path d="M12 140 C12 104, 34 94, 60 94 C86 94, 108 104, 108 140 Z" fill="url(#maleShirt)" />
    <!-- White Inner Collar -->
    <polygon points="60,94 48,112 72,112" fill="#ffffff" />
    <polygon points="60,99 54,112 66,112" fill="#e2e8f0" />

    <!-- Neck -->
    <rect x="51" y="73" width="18" height="24" rx="4" fill="url(#maleSkin)" />

    <!-- Ears -->
    <circle cx="34" cy="58" r="6.5" fill="url(#maleSkin)" />
    <circle cx="86" cy="58" r="6.5" fill="url(#maleSkin)" />

    <!-- Face -->
    <ellipse cx="60" cy="56" rx="26" ry="28" fill="url(#maleSkin)" />

    <!-- Eyes (Friendly curved lashes) -->
    <path d="M48 55 Q53 60 58 55" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M62 55 Q67 60 72 55" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Smile -->
    <path d="M54 68 Q60 73 66 68" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Peci / Kopiah Hitam Elegan -->
    <path d="M33 42 C33 22, 41 18, 60 18 C79 18, 87 22, 87 42 C87 43, 33 43, 33 42 Z" fill="url(#peciGrad)" />
    <!-- Peci subtle top crown curvature -->
    <path d="M35 32 Q60 22 85 32 L87 40 Q60 43 33 40 Z" fill="#0f172a" opacity="0.4" />
    <!-- Golden/Velvet trim accent on bottom of peci -->
    <path d="M33 41 Q60 44 87 41" stroke="#f59e0b" stroke-width="1.8" fill="none" opacity="0.85" />
  </g>
</svg>
